<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>副本任務查詢</title>
<script>const whTooltips = {colorLinks: true, iconizeLinks: true, renameLinks: false, iconSize: "medium"};</script>
<script src="https://wow.zamimg.com/js/tooltips.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 單一深色主題：像遊戲內的任務日誌。左側副本列表，右側該副本的三類任務。 */
  --bg:#131619;
  --panel:#1b1f24;
  --panel-2:#22272e;
  --line:#2e343c;
  --ink:#ebe6da;
  --muted:#9b9a92;
  --horde:#c41f1f;
  --alliance:#2f6fd6;
  --fac:var(--horde);
  --direct:#e8b93c;
  --inside:#5fbfa4;
  --chain:#d9804f;
  --skip:#6d7079;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--direct);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 20px;border-bottom:3px solid var(--fac);background:linear-gradient(180deg,color-mix(in srgb,var(--fac) 14%,var(--bg)) 0%,var(--bg) 100%)}
header.top h1{font-family:var(--display);font-weight:900;font-size:22px;margin:0;letter-spacing:.04em;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.lvl{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px}
.lvl input{width:220px;padding:5px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lvl .hint{color:var(--muted);font-size:12px}

.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 64px)}
nav.list{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
nav.list button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 12px;border-radius:8px;border-left:3px solid transparent}
nav.list button:hover{background:var(--panel-2)}
nav.list button[aria-current="true"]{background:var(--panel-2);border-left-color:var(--fac)}
nav.list button:focus-visible{outline:2px solid var(--direct)}
nav.list .n{font-weight:700}
nav.list .r{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
nav.list .b{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;line-height:1.3}
nav.list .b strong{display:block;color:var(--direct);font-size:16px}
nav.list .fit{color:var(--inside);font-size:11px;margin-left:6px;font-weight:500}
nav.list button.dim .n,nav.list button.dim .r{opacity:.5}

main{padding:20px 24px 48px;min-width:0}
.dhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.dhead h2{font-family:var(--display);font-size:28px;margin:0}
.dhead .lr{color:var(--muted);font-variant-numeric:tabular-nums}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.summary div{background:var(--panel);padding:12px 16px}
.summary .k{font-size:12px;color:var(--muted)}
.summary .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.summary .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.summary .total .v{color:var(--direct)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.btn{cursor:pointer;padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2)}
.btn:hover{border-color:var(--direct)}
.btn.primary{background:var(--fac);border-color:var(--fac);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.toast{font-size:13px;color:var(--inside)}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:16px}
.col .desc{color:var(--muted);font-size:12px;margin:0 0 10px}
.mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--display);font-weight:900;font-size:14px;color:#151515}
.c-direct .mark{background:var(--direct)}
.c-inside .mark{background:var(--inside)}
.c-chain .mark{background:var(--chain)}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:8px}

.qcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.c-direct .qcard,.qcard.c-direct{--c:var(--direct)}
.c-inside .qcard,.qcard.c-inside{--c:var(--inside)}
.c-chain .qcard,.qcard.c-chain{--c:var(--chain)}
.qcard .cat{font-size:12px;font-weight:700;color:var(--c)}
.qcard .qh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.qcard .t{display:block;font-size:16px;font-weight:700;line-height:1.35;text-wrap:balance}
.qcard .en{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
.qcard .lv{flex:0 0 auto;font-size:12px;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.qcard .lv b{color:var(--ink)}
.qcard .info{display:grid;grid-template-columns:4.2em 1fr;gap:3px 10px;margin:0;font-size:13px;line-height:1.5}
.qcard .info dt{color:var(--muted)}
.qcard .info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.qcard .info .num{font-variant-numeric:tabular-nums}
.qcard .note{margin:0;font-size:13px;line-height:1.6;color:var(--ink);opacity:.85}
.qcard .blk{font-size:13px;line-height:1.6;padding:8px 10px;border-radius:6px;background:var(--panel-2)}
.qcard .blk .lab{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.qcard .src{border:1px solid color-mix(in srgb,var(--chain) 35%,var(--line))}
.qcard .src .lab{color:var(--chain)}
.qcard .src .sq{font-weight:700}
.qcard .src .sw{display:block;color:var(--muted)}
.qcard .src .path,.qcard .src .warn{display:block;font-size:12px;margin-top:4px}
.qcard .src .path{color:var(--muted)}
.qcard .src .warn{color:#e0a15f}
.qcard .tip{border:1px solid color-mix(in srgb,var(--inside) 30%,var(--line))}
.qcard .tip .lab{color:var(--inside)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--fac)}
.tabs button:focus-visible{outline:2px solid var(--direct)}
.loot .desc{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:70ch}
.boss{margin-bottom:22px}
.bh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.bh .bn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:900}
.bh h3{margin:0;font-family:var(--display);font-size:19px}
.bh .bm{color:var(--muted);font-size:13px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.item.q2{--qc:#4dff5e}.item.q3{--qc:#4fa8ff}.item.q4{--qc:#c47dff}
.item .ih{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .in{font-weight:700;color:var(--qc)}
.item .use{font-size:11px;white-space:nowrap;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--inside) 18%,var(--panel-2));color:var(--inside)}
.item.no .use{background:var(--panel-2);color:var(--muted)}
.item.no{opacity:.55}
.item .it{font-size:12px;color:#b9b8b0}
.item .st{margin:2px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.55;color:#ffffff}
.item .st .g{color:#4dff5e}
.item .st .pend{color:var(--muted);font-size:12px}
.item .row{display:flex;gap:10px;align-items:flex-start}
.item .ico{flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;border-radius:6px;border:2px solid var(--qc);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--qc) 22%,#1a1d22),#101215 75%);box-shadow:0 0 0 1px #000 inset,0 0 8px color-mix(in srgb,var(--qc) 35%,transparent);color:color-mix(in srgb,var(--qc) 55%,#e8e4da)}
.item .ico svg{width:28px;height:28px}
.item .body{flex:1;min-width:0}
.item .wh{font-size:12px;color:var(--muted);text-decoration:none;margin-top:4px}
.item .wh:hover{color:var(--qc);text-decoration:underline}
.item .in a,.item .in a.q2,.item .in a.q3,.item .in a.q4{color:var(--qc)!important;text-decoration:none}
.item .in a:hover{text-decoration:underline}
body.wh-on .item .ico{display:none}
.item .in a img,.item .in a ins{vertical-align:middle;margin-right:6px}
.maplink{font-size:12px;color:var(--muted);text-decoration:none}
.maplink:hover{color:var(--ink);text-decoration:underline}
.bh .maplink{display:inline-block;margin-top:2px}
.item .chg{margin-top:6px;padding:6px 8px;border-radius:6px;background:#1f2329;border:1px solid var(--line);font-size:12px}
.item .chg .ct{color:#ffbe73;font-weight:700;margin-bottom:3px}
.item .chg ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.item .chg li{display:contents}
.item .chg .k{color:#c9c7bf}
.item .chg .o{color:#8f8d86;text-align:right}
.item .chg li.up .v{color:#6be37a}
.item .chg li.down .v{color:#ff8a80}
.item .chg li.same .v{color:#e8e6df}
.item .chg li.wide .k{display:none}
.item .chg li.wide .v{grid-column:1 / -1}
.pendq ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pendq li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.who .chip{padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
body[data-f="A"]{--fac:var(--alliance)}
.who .chip{display:inline-flex;align-items:center;gap:6px}
.who .chip .f{font-weight:700;color:var(--fc)}
.who .chip .cl{font-weight:700;color:var(--cc)}
.who .chip.h{--fc:#ff4a3d;border-color:var(--horde)}
.who .chip.a{--fc:#5b9bff;border-color:var(--alliance)}
.opts label .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc,var(--fc));margin-right:7px;vertical-align:1px}
.opts label[data-cc]{color:var(--cc)}
.opts label[data-fc]{color:var(--fc)}
.opts label:has(input:checked)[data-cc]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--panel-2))}
.opts label:has(input:checked)[data-fc]{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 16%,var(--panel-2))}
.gate{max-width:640px;margin:40px auto;padding:24px 28px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.gate h2{font-family:var(--display);font-size:24px;margin:0 0 6px}
.gate p{color:var(--muted);margin:0 0 18px}
.gate fieldset{border:0;padding:0;margin:0 0 18px}
.gate legend{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{cursor:pointer;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:14px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){border-color:var(--direct);color:var(--direct)}
.opts label:has(input:focus-visible){outline:2px solid var(--direct)}
.opts label.off{opacity:.3;cursor:not-allowed}
.gate .err{color:#e06c5f;font-size:13px;min-height:1.2em}
.notice{font-size:13px;color:#e0a15f;margin:0 0 14px}
.results h3{font-family:var(--display);font-size:18px;margin:18px 0 8px}
.results .grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

.skip{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.skip h3{font-size:14px;margin:0 0 8px;color:var(--muted);display:flex;gap:8px;align-items:center}
.skip ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px 18px}
.skip li{font-size:13px;color:var(--muted)}
.skip li b{color:var(--ink);font-weight:500}

footer{color:var(--muted);font-size:12px;margin-top:30px;max-width:70ch}

@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  nav.list{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav.list button{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent}
  nav.list button[aria-current="true"]{border-bottom-color:var(--fac)}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding:16px}
  .lvl{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>副本任務規劃</h1>
    <div class="sub">各副本的任務在哪接、前置系列從哪個任務開始</div>
  </div>
  <div class="lvl">
    <div class="who" id="who"></div>
    <label for="q" class="sr">搜尋</label>
    <input id="q" type="search" placeholder="搜尋任務或 NPC" autocomplete="off">
  </div>
</header>
<div class="wrap">
  <nav class="list" id="nav" aria-label="副本"></nav>
  <main id="main"></main>
</div>

<script>
/* ===== 資料 =====
   分類：
   direct 直接接：找 NPC 就能接，不用先做其他任務（接了在同一趟內接續完成的也算）
   inside 副本內：副本裡撿到、打王掉落、環境物件或 NPC 給的任務
   chain  需要前置：要先完成其他任務才接得到（prep 寫要先做什麼）
   skip   不計入：要打兩趟以上、沒有副本目標、或出副本後才做的後續（reason 寫原因）
   之後擴充：在 DUNGEONS 加副本，在 QUESTS 加任務即可。 */
const DUNGEONS = [
  {id:"rfc",     name:"怒焰裂谷",         lr:"13–18"},
  {id:"thanes",  name:"族長之廳",         lr:"13–18"},
  {id:"rfk-ruin",name:"羅德隆廢墟",       lr:"15–20"},
  {id:"dm",      name:"死亡礦坑",         lr:"17–26"},
  {id:"wc",      name:"哀嚎洞穴",         lr:"17–24"},
  {id:"sfk",     name:"影牙城堡",         lr:"22–30"},
  {id:"stocks",  name:"監獄",             lr:"24–32"},
  {id:"bfd",     name:"黑澗深淵",         lr:"24–32"},
  {id:"dig",     name:"挖掘場：濕地",     lr:"26–31"},
  {id:"dalaran", name:"達拉然城",         lr:"28–33"},
  {id:"gnomer",  name:"諾姆瑞根",         lr:"29–38"},
  {id:"rfkraul", name:"剃刀沼澤",         lr:"29–38"},
  {id:"sm-gy",   name:"血色修道院・墓地",  lr:"30–38"},
  {id:"sm-lib",  name:"血色修道院・圖書館",lr:"33–41"},
  {id:"sm-arm",  name:"血色修道院・軍械庫",lr:"32–42"},
  {id:"sm-cath", name:"血色修道院・大教堂",lr:"35–45"},
  {id:"sm-all",  name:"血色修道院（各區共通）",lr:"30–46"},
  {id:"drowned", name:"沉沒之城",         lr:"35–40"},
  {id:"rfd",     name:"剃刀高地",         lr:"37–46"},
  {id:"uld",     name:"奧達曼",           lr:"35–45"},
  {id:"krol",    name:"克羅多克要塞",     lr:"38–45"},
  {id:"zf",      name:"祖爾法拉克",       lr:"44–54"},
  {id:"mara",    name:"瑪拉頓",           lr:"46–55"}
];

const QUESTS = [
  // 怒焰裂谷
  {d:"rfc",c:"direct",n:"試探敵人",en:"Testing an Enemy's Strength",npc:"拉哈羅",w:"雷霆崖・長者高地 (69.4, 28.8)",lv:9,xp:2150,note:"殺怒焰穴居人 ×8、怒焰薩滿 ×8"},
  {d:"rfc",c:"chain",n:"隱藏的敵人",en:"Hidden Enemies",npc:"索爾",w:"奧格瑪・葛羅瑪許堡要塞 (32.0, 37.8)",lv:9,xp:2350,src:{q:"隱藏的敵人（第 1 步）",npc:"索爾",w:"奧格瑪・葛羅瑪許堡要塞 (32.0, 37.8)",path:"隱藏的敵人（索爾）→ 找暗影裂口的尼爾魯·火刃對話 → 本任務"},note:"殺巴札蘭、耶戈什",tip:"巴札蘭在耶戈什上方：從打塔拉加曼的地方往耶戈什走，過岩漿小橋前改走右手邊，沿牆走進最暗的地方就有路上去。"},
  {d:"rfc",c:"direct",n:"饑餓者塔拉加曼",en:"Slaying the Beast",npc:"尼爾魯·火刃",w:"奧格瑪・暗影裂口 (49.4, 50.4)",lv:9,xp:2350,note:"帶回塔拉加曼的心臟",tip:"先把他從石橋上引開再打，他會把人擊飛進岩漿，掉下去會直接死。"},
  {d:"rfc",c:"direct",n:"毀滅之力",en:"The Power to Destroy...",npc:"瓦里瑪薩斯",w:"幽暗城・皇家區 (56.2, 92.4)",lv:9,xp:2950,note:"從灼刃教徒／術士身上打兩本書"},
  {d:"rfc",c:"direct",n:"歸還背包",en:"Returning the Lost Satchel",npc:"拉哈羅（先接「尋找背包」）",w:"雷霆崖・長者高地 (69.4, 28.8)",lv:9,xp:2950,note:"副本內找到瑪爾·恐怖圖騰的背包後接續，交回拉哈羅",tip:"進副本走到 T 字路口，走最近的右邊上坡；到平台後左手邊有小房間，瑪爾的屍體旁有三隻穴居人。"},

const CHG_WORDS = [["Item level","物品等級"],["Bonus armor","額外護甲"],["Armor","護甲"],["Strength","力量"],["Agility","敏捷"],["Stamina","耐力"],["Intellect","智力"],["Spirit","精神"],["Shadow Spell Power","暗影法術能量"],["Spell Power","法術能量"],["Spell Damage","法術傷害"],["Spell Penetration","法術穿透"],["Healing","治療"],["Attack Power","攻擊強度"],["Damage","傷害"],["Speed","速度"],["Durability","耐久"],["Health per 5 sec","每 5 秒生命"],["Mana per 5 sec","每 5 秒法力"],["Nature Resistance","自然抗性"],["Shadow Resistance","暗影抗性"],["Fire Resistance","火焰抗性"],["Frost Resistance","冰霜抗性"],["Arcane Resistance","秘法抗性"],["Defense","防禦"],["Binds when picked up","拾取後綁定"],["New icon","新圖示"],["Unique","唯一"],["Epic","史詩"],["Rare","精良"],["Uncommon","優秀"],["Common","普通"],["Mace (Main Hand)","主手錘"],["Mace (One-Hand)","單手錘"]];
function chgText(s){
  if (!s) return "";
  const parts = [];
  const re = /\[((?:[^\[\]]|\[[^\[\]]*\])*)\]/g; let m;
  while ((m = re.exec(s))){
    let t = m[1];
    if (/^效果[:：]/.test(t)){ parts.push("特效數值調整"); continue; }
    t = t.replace(/\[none\]/g, "無").replace(/\[([^\[\]]*)\]/g, "$1");
    CHG_WORDS.forEach(([en, zh]) => { t = t.split(en).join(zh); });
    t = t.replace(/^唯一 唯一/, "唯一");
    let x;
    if ((x = t.match(/^(.*) instead of (.*)$/))) t = x[1] + "（原 " + x[2] + "）";
    else if ((x = t.match(/^(.*) added$/))) t = "新增 " + x[1];
    else if ((x = t.match(/^(.*) removed$/))) t = "移除 " + x[1];
    else if ((x = t.match(/^(.*) changed$/))) t = x[1] + "有調整";
    t = t.replace(/^類型 /, "類型：").replace(/^效果有調整$/, "特效有調整").replace(/^新增 效果$/, "新增特效").replace(/^移除 效果$/, "移除特效");
    parts.push(t);
  }
  return parts.join("・");
}
/* 把調整文字拆成逐項資料，判斷是提升還是降低 */
const QRANK = {"普通":1,"優秀":2,"精良":3,"史詩":4};
const NEUTRAL = /^(速度|需要等級|物品等級|類型|綁定)$/;
function chgItems(text){
  if (!text) return [];
  return text.split("・").map(t => {
    let m;
    if ((m = t.match(/^新增\s*(.+?)\s*([\d.\- %]*)$/))) return {k:m[1] || t, v:m[2] ? "+" + m[2].trim() : "新增", kind:"up"};
    if ((m = t.match(/^移除\s*(.+?)\s*([\d.\- %]*)$/))) return {k:m[1], v:"移除", kind:"down"};
    if ((m = t.match(/^(.*)（原 (.*)）$/))){
      let [, now, old] = m, k = "";
      const sp = now.match(/^(.*?)\s*([-\d.][\d.\- %]*)$/);
      if (sp){ k = sp[1]; now = sp[2]; }
      else if (QRANK[now]){ k = "品質"; }
      else if (/綁定/.test(now)){ k = "綁定"; }
      else if (/^類型/.test(now)){ k = "類型"; now = now.replace(/^類型：/, ""); }
      let kind = "same";
      if (k === "品質") kind = QRANK[now] > QRANK[old] ? "up" : "down";
      else if (!NEUTRAL.test(k)){
        const a = parseFloat(String(now).split(" ")[0]), b = parseFloat(String(old).split(" ")[0]);
        if (!isNaN(a) && !isNaN(b) && a !== b) kind = a > b ? "up" : "down";
      }
      return {k: k || "", v: now, o: old, kind};
    }
    return {k:"", v:t, kind:"same"};
  });
}
function lootFor(id){
  if (LOOT[id]) return LOOT[id];
  const rows = RAW_LOOT[id];
  if (!rows) return null;
  const groups = {}, npcIds = {};
  rows.forEach(r => {
    const [iid, n, q, cl, sc, slot, req, src, chg, npc] = r;
    const key = src === "-" ? "小怪／其他" : src.split("/")[0];
    if (npc && key !== "小怪／其他") npcIds[key] = npc;
    (groups[key] = groups[key] || []).push({id:iid, n, q, slot: SLOT[slot] || (cl === 9 ? "圖紙" : cl === 12 ? "任務物品" : cl === 1 ? "背包" : "其他"), t: itemType(cl, sc), req, chg: chgText(chg), stats:[]});
  });
  const order = BOSS_ORDER[id] || [];
  const minReq = g => Math.min(...groups[g].map(i => i.req || 99));
  const names = Object.keys(groups).sort((a, b) => {
    if (a === "小怪／其他") return 1; if (b === "小怪／其他") return -1;
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1; if (ib >= 0) return 1;
    return minReq(a) - minReq(b);
  });
  return {note:"首領順序是大概的攻略順序，新副本依掉落等級排列。", bosses: names.map(n => ({n, npc: npcIds[n] || 0, lv:"", where: n === "小怪／其他" ? "副本內小怪或稀有怪" : "", quest:null, items: groups[n]}))};
}

const TT_CACHE = {};
const TT_SKIP = /^(物品等級|拾取後綁定|裝備後綁定|耐久|售價|掉落於|唯一|僅可裝備一件|需要等級)/;
const TT_SLOT = /^(頭部|頸部|肩部|背部|胸部|手腕|手|腰部|腿部|腳|手指|飾品|主手|副手|單手|雙手|遠程|投擲|副手物品|聖物|背包)(\s|$)/;
function ttLines(html){
  const box = document.createElement("div"); box.innerHTML = html;
  const lines = []; let cur = {t:"", g:false};
  const push = () => { const t = cur.t.replace(/\u0008/g, "").replace(/\s+/g, " ").trim(); if (t) lines.push({t, g:cur.g}); cur = {t:"", g:false}; };
  const walk = (node, green) => {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3){ cur.t += n.nodeValue; if (green && n.nodeValue.trim()) cur.g = true; return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName;
      if (tag === "BR"){ push(); return; }
      if (tag === "TR" || tag === "TABLE" || tag === "DIV"){ push(); walk(n, green || n.classList.contains("q2")); push(); return; }
      if (tag === "TH" || tag === "TD"){ walk(n, green || n.classList.contains("q2")); cur.t += " "; return; }
      walk(n, green || n.classList.contains("q2"));
    });
  };
  walk(box, false); push();
  return lines;
}
async function fetchTip(id){
  if (TT_CACHE[id]) return TT_CACHE[id];
  try { const c = sessionStorage.getItem("tt" + id); if (c) return (TT_CACHE[id] = JSON.parse(c)); } catch(e) {}
  const r = await fetch("https://nether.wowhead.com/tooltip/item/" + id + "?dataEnv=16&locale=10");
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  const all = ttLines(j.tooltip || "");
  let drop = "";
  const stats = [];
  all.slice(1).forEach(l => {
    const m = l.t.match(/^掉落機率[:：]\s*(.+)$/);
    if (m){ drop = m[1]; return; }
    if (TT_SKIP.test(l.t)) return;
    if (TT_SLOT.test(l.t)) return;
    if (l.t === j.name) return;
    stats.push(l);
  });
  const out = {stats, drop};
  TT_CACHE[id] = out;
  try { sessionStorage.setItem("tt" + id, JSON.stringify(out)); } catch(e) {}
  return out;
}
let ttQueue = [], ttRunning = 0;
function queueTip(id, card, it){
  ttQueue.push({id, card, it}); pumpTips();
}
function pumpTips(){
  while (ttRunning < 4 && ttQueue.length){
    const job = ttQueue.shift(); ttRunning++;
    fetchTip(job.id).then(d => fillTip(job.card, job.it, d)).catch(() => {}).finally(() => { ttRunning--; pumpTips(); });
  }
}
function fillTip(card, it, d){
  if (!card.isConnected) return;
  let ul = card.querySelector(".st");
  if (!ul){ ul = document.createElement("ul"); ul.className = "st"; card.querySelector(".row").after(ul); }
  ul.innerHTML = "";
  d.stats.forEach(l => { const li = document.createElement("li"); li.textContent = l.t; if (l.g) li.className = "g"; ul.appendChild(li); });
  if (d.drop){
    const it2 = card.querySelector(".it");
    if (it2 && !/掉落機率/.test(it2.textContent)) it2.textContent += "・掉落機率 " + d.drop;
  }
}

/* ===== 畫面 ===== */
const nav = document.getElementById("nav");
const main = document.getElementById("main");
const search = document.getElementById("q");
let current = DUNGEONS[0].id;
let view = "quests";
const fmt = n => n.toLocaleString("en-US");
const CAT = {direct:"直接接", inside:"副本內", chain:"需要前置"};
const dName = id => DUNGEONS.find(d => d.id === id).name;

function renderNav(){
  nav.innerHTML = "";
  for (const d of DUNGEONS){
    const fac = who.f === "H" ? 2 : 1;
    const qs = PENDING_Q[d.id] ? PENDING_Q[d.id].filter(q => q[2] === null || q[2] === 3 || q[2] === fac) : QUESTS.filter(q => q.d === d.id && q.c !== "skip" && avail(q));
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-current", (!search.value.trim() && d.id === current) ? "true" : "false");
    b.innerHTML = `<span class="n"></span><span class="b"><strong>${qs.length}</strong>個任務</span><span class="r">${d.lr} 級</span>`;
    b.querySelector(".n").textContent = d.name;
    b.addEventListener("click", () => { search.value = ""; if (d.id !== current) view = "quests"; location.hash = d.id; render(); });
    nav.appendChild(b);
  }
}

function add(el, cls, text){ const x = document.createElement("div"); x.className = cls; x.textContent = text; el.appendChild(x); return x; }

function card(q, showDungeon){
  const el = document.createElement("div");
  el.className = "qcard c-" + q.c;
  if (showDungeon) add(el, "cat", dName(q.d) + "・" + CAT[q.c]);
  const h = document.createElement("div"); h.className = "qh";
  h.innerHTML = '<div><span class="t"></span><span class="en"></span></div><span class="lv"><b>' + q.lv + '</b> 級可接</span>';
  h.querySelector(".t").textContent = q.n;
  h.querySelector(".en").textContent = q.en;
  el.appendChild(h);
  const dl = document.createElement("dl"); dl.className = "info";
  const row = (k, v, cls) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; if (cls) dd.className = cls; dl.append(dt, dd); };
  row(q.npc.startsWith("物品") ? "觸發" : "接任務", q.npc.replace(/^物品：/, "物品「") + (q.npc.startsWith("物品") ? "」" : ""));
  row("地點", q.w);
  if (!/^物品|副本/.test(q.npc) && !/^副本/.test(q.w) && !/待查/.test(q.w)){
    const a = document.createElement("a"); a.className = "maplink"; a.target = "_blank"; a.rel = "noopener";
    a.href = "https://www.wowhead.com/forever/tw/search?q=" + encodeURIComponent(q.npc.replace(/（.*?）/g, ""));
    a.textContent = "在 Wowhead 看 NPC 位置 ↗";
    const dd = document.createElement("dd"); dd.appendChild(a); const dt = document.createElement("dt"); dl.append(dt, dd);
  }
  row("經驗", q.xp != null ? fmt(q.xp) : (q.xpText || "—"), "num");
  el.appendChild(dl);
  if (q.note){ const n = document.createElement("p"); n.className = "note"; n.textContent = q.note; el.appendChild(n); }
  if (q.src){
    const s = document.createElement("div"); s.className = "blk src";
    add(s, "lab", "系列源頭");
    const line = document.createElement("div");
    line.innerHTML = '「<span class="sq"></span>」<span class="sw"></span>';
    line.querySelector(".sq").textContent = q.src.q;
    line.querySelector(".sw").textContent = q.src.npc + "・" + q.src.w;
    s.appendChild(line);
    if (q.src.path) add(s, "path", q.src.path);
    if (q.src.warn) add(s, "warn", q.src.warn);
    el.appendChild(s);
  }
  if (q.tip){ const t = document.createElement("div"); t.className = "blk tip"; add(t, "lab", "Wowhead 玩家提示"); t.append(q.tip); el.appendChild(t); }
  return el;
}

const COLS = [
  {c:"direct", t:"直接接", m:"!", desc:"進副本前去找 NPC 接"},
  {c:"inside", t:"副本內", m:"✦", desc:"副本裡撿到、打王掉落、環境物件或 NPC 給的"},
  {c:"chain",  t:"需要前置", m:"…", desc:"要先做完同系列的任務，下方標出系列源頭"}
];

function renderDungeon(){
  const d = DUNGEONS.find(x => x.id === current);
  const all = QUESTS.filter(q => q.d === d.id && avail(q));
  main.innerHTML = `<div class="dhead"><h2></h2><span class="lr">${d.lr} 級・${all.filter(q=>q.c!=="skip").length} 個任務</span></div>${who.f==="A" ? '<p class="notice">目前只收錄部落任務，這裡只列出雙方都能接的；聯盟專屬任務之後補上。</p>' : ""}<div class="actions"><button class="btn primary" id="copy" type="button">複製出發前清單</button><span class="toast" id="toast" role="status"></span></div><div class="cols"></div>`;
  main.querySelector("#copy").addEventListener("click", () => copyList(d));
  main.querySelector("h2").textContent = d.name;
  addTabs(d);
  if (view === "loot"){ renderLoot(d); return; }
  if (PENDING_Q[d.id]){
    main.querySelector(".cols").remove(); main.querySelector(".actions")?.remove();
    const box = document.createElement("div"); box.className = "pendq";
    const fac = who.f === "H" ? 2 : 1;
    const qs = PENDING_Q[d.id].filter(q => q[2] === null || q[2] === 3 || q[2] === fac);
    box.innerHTML = '<p class="notice">這個副本的任務還在整理中，接任務的 NPC、分類和前置系列之後補上。目前先列出你的陣營能做的任務名稱。</p><ul></ul>';
    const ul = box.querySelector("ul");
    if (!qs.length) ul.innerHTML = '<li class="empty">你的陣營在這個副本沒有任務。</li>';
    qs.forEach(q => { const li = document.createElement("li"); li.textContent = q[1] + "・可接 " + q[4] + " 級"; ul.appendChild(li); });
    main.appendChild(box); footer(); return;
  }
  const cols = main.querySelector(".cols");
  for (const col of COLS){
    const qs = all.filter(q => q.c === col.c);
    const box = document.createElement("section");
    box.className = "col c-" + col.c;
    box.innerHTML = `<h3><span class="mark" aria-hidden="true">${col.m}</span>${col.t}<span class="tag">${qs.length}</span></h3><p class="desc">${col.desc}</p><div class="cards"></div>`;
    const list = box.querySelector(".cards");
    if (!qs.length) list.innerHTML = '<div class="empty">沒有這類任務</div>';
    qs.forEach(q => list.appendChild(card(q)));
    cols.appendChild(box);
  }
  const skips = all.filter(q => q.c === "skip");
  if (skips.length){
    const sec = document.createElement("section");
    sec.className = "skip";
    sec.innerHTML = `<h3>未列入（${skips.length}）：要打兩趟、沒有副本目標，或出副本後才做的</h3><ul></ul>`;
    const ul = sec.querySelector("ul");
    skips.forEach(q => { const li = document.createElement("li"); li.innerHTML = "<b></b>："; li.querySelector("b").textContent = q.n; li.append(q.reason); ul.appendChild(li); });
    main.appendChild(sec);
  }
  footer();
}

function addTabs(d){
  const t = document.createElement("div"); t.className = "tabs"; t.setAttribute("role","tablist");
  [["quests","任務"],["loot","掉落"]].forEach(([k,label]) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", view === k ? "true" : "false");
    b.textContent = label + (k === "loot" && !lootFor(d.id) ? "（未收錄）" : "");
    b.addEventListener("click", () => { view = k; render(); });
    t.appendChild(b);
  });
  main.querySelector(".dhead").after(t);
  if (view === "loot"){ main.querySelector(".actions")?.remove(); main.querySelector(".notice")?.remove(); }
}

function renderLoot(d){
  ttQueue = [];
  main.querySelector(".cols").remove();
  const data = lootFor(d.id);
  const wrap = document.createElement("div"); wrap.className = "loot";
  if (!data){ wrap.innerHTML = '<div class="empty">這個副本的掉落還沒收錄。</div>'; main.appendChild(wrap); footer(); return; }
  const p = document.createElement("p"); p.className = "desc"; p.textContent = data.note + "「你可以用」依你選的職業判斷能不能裝備。"; wrap.appendChild(p);
  data.bosses.forEach((b, i) => {
    const sec = document.createElement("section"); sec.className = "boss";
    sec.innerHTML = '<div class="bh"><span class="bn">' + (i + 1) + '</span><div><h3></h3><div class="bm"></div></div></div><div class="items"></div>';
    sec.querySelector("h3").textContent = b.n;
    sec.querySelector(".bm").textContent = [b.lv, b.where, b.quest ? "任務：" + b.quest : "", b.items.length + " 件"].filter(Boolean).join("・");
    if (b.n !== "小怪／其他"){
      const a = document.createElement("a"); a.className = "maplink"; a.target = "_blank"; a.rel = "noopener";
      a.href = b.npc ? "https://www.wowhead.com/forever/tw/npc=" + b.npc + "#map" : "https://www.wowhead.com/forever/tw/search?q=" + encodeURIComponent(b.n);
      a.textContent = "在 Wowhead 看位置 ↗"; sec.querySelector(".bm").after(a);
    }
    const list = sec.querySelector(".items");
    b.items.forEach(it => {
      const ok = canUse(it);
      const r = document.createElement("div"); r.className = "item q" + it.q + (ok === false ? " no" : "");
      r.innerHTML = '<div class="row"><span class="ico">' + iconFor(it) + '</span><div class="body"><div class="ih"><span class="in"></span><span class="use"></span></div><div class="it"></div></div></div><ul class="st"></ul>';
      if (it.id){ const a = document.createElement("a"); a.href = "https://www.wowhead.com/forever/tw/item=" + it.id; a.target = "_blank"; a.rel = "noopener"; a.textContent = it.n; r.querySelector(".in").appendChild(a); }
      else r.querySelector(".in").textContent = it.n;
      if (ok === null) r.querySelector(".use").remove(); else r.querySelector(".use").textContent = ok ? "你可以用" : who.c + "不能用";
      r.querySelector(".it").textContent = it.slot + (it.t !== it.slot ? "・" + it.t : "") + (it.req ? "・需要等級 " + it.req : "") + (it.drop ? "・掉落機率 " + it.drop : "");
      const ul = r.querySelector(".st");
      it.stats.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
      if (it.pending){ const li = document.createElement("li"); li.className = "pend"; li.textContent = "完整屬性和掉落機率待補"; ul.appendChild(li); }
      if (it.chg){
        const c = document.createElement("div"); c.className = "chg";
        c.innerHTML = '<div class="ct">Forever 調整</div><ul></ul>';
        const ul2 = c.querySelector("ul");
        const list = /（原|新增|移除/.test(it.chg) ? chgItems(it.chg) : [{k:"", v:it.chg, kind:"same"}];
        list.forEach(x => {
          const li = document.createElement("li"); li.className = x.kind;
          li.innerHTML = '<span class="k"></span><span class="v"></span><span class="o"></span>';
          li.querySelector(".k").textContent = x.k;
          li.querySelector(".v").textContent = (x.kind === "up" ? "▲ " : x.kind === "down" ? "▼ " : "") + x.v;
          li.querySelector(".o").textContent = x.o ? "原 " + x.o : "";
          if (!x.k) li.classList.add("wide");
          ul2.appendChild(li);
        });
        r.appendChild(c);
      }
      if (it.id) queueTip(it.id, r, it);
      if (!it.stats.length && !it.pending) r.querySelector(".st").remove();
      list.appendChild(r);
    });
    wrap.appendChild(sec);
  });
  main.appendChild(wrap);
  footer();
}

function renderSearch(term){
  const t = term.toLowerCase();
  const hits = QUESTS.filter(q => q.c !== "skip" && avail(q) && [q.n, q.en, q.npc, q.w, q.src && q.src.q, q.src && q.src.npc].some(x => x && x.toLowerCase().includes(t)));
  main.innerHTML = `<div class="dhead"><h2>搜尋結果</h2><span class="lr">${hits.length} 個任務</span></div><div class="results"></div>`;
  const r = main.querySelector(".results");
  if (!hits.length){ r.innerHTML = '<div class="empty">找不到符合的任務，試試任務名、英文名或 NPC 名字</div>'; }
  for (const d of DUNGEONS){
    const qs = hits.filter(q => q.d === d.id);
    if (!qs.length) continue;
    const h = document.createElement("h3"); h.textContent = d.name + "（" + d.lr + " 級）"; r.appendChild(h);
    const g = document.createElement("div"); g.className = "grp";
    qs.forEach(q => g.appendChild(card(q, true)));
    r.appendChild(g);
  }
  footer();
}

function copyList(d){
  const qs = QUESTS.filter(q => q.d === d.id && q.c !== "skip" && avail(q));
  const line = q => `・${q.n}（${q.npc}，${q.w}）`;
  const out = [`【${d.name}】${d.lr} 級・${qs.length} 個任務`];
  const direct = qs.filter(q=>q.c==="direct"), chain = qs.filter(q=>q.c==="chain"), inside = qs.filter(q=>q.c==="inside");
  if (direct.length) out.push("", "直接接：", ...direct.map(line));
  if (chain.length) out.push("", "需要前置：", ...chain.map(q => line(q) + (q.src ? `\n　源頭：「${q.src.q}」${q.src.npc}，${q.src.w}` : "")));
  if (inside.length) out.push("", "副本內：", ...inside.map(q => `・${q.n}（${q.w}）`));
  const t = document.getElementById("toast");
  navigator.clipboard.writeText(out.join("\n")).then(() => { t.textContent = "已複製，可以貼給隊友"; }, () => { t.textContent = "瀏覽器不允許複製，請手動選取文字"; });
}

function renderGate(){
  nav.innerHTML = "";
  search.disabled = true;
  document.getElementById("who").innerHTML = "";
  const f0 = who ? who.f : "H";
  main.innerHTML = `<form class="gate" id="gate">
    <h2>先選你的角色</h2>
    <p>有些任務限定陣營、職業或種族，選好後只會列出你能做的任務。</p>
    <fieldset><legend>陣營</legend><div class="opts" id="o-f">
      <label data-fc style="--fc:${FAC_COLOR.H}"><input type="radio" name="f" value="H"><span class="dot"></span>部落</label>
      <label data-fc style="--fc:${FAC_COLOR.A}"><input type="radio" name="f" value="A"><span class="dot"></span>聯盟</label></div></fieldset>
    <fieldset><legend>種族</legend><div class="opts" id="o-r"></div></fieldset>
    <fieldset><legend>職業</legend><div class="opts" id="o-c"></div></fieldset>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit">查看任務</button>
  </form>`;
  const form = main.querySelector("#gate");
  const fillRaces = f => {
    document.body.dataset.f = f;
    main.querySelector("#o-r").innerHTML = RACES[f].map(r => `<label><input type="radio" name="r" value="${r}">${r}</label>`).join("");
  };
  main.querySelector("#o-c").innerHTML = CLASSES.map(c => `<label data-cc style="--cc:${CLASS_COLOR[c]}"><input type="radio" name="c" value="${c}"><span class="dot"></span>${c}</label>`).join("");
  form.querySelector(`input[name=f][value=${f0}]`).checked = true;
  fillRaces(f0);
  if (who){
    const r = form.querySelector(`input[name=r][value="${who.r}"]`); if (r) r.checked = true;
    const c = form.querySelector(`input[name=c][value="${who.c}"]`); if (c) c.checked = true;
  }
  const syncClasses = () => {
    const f = form.querySelector("input[name=f]:checked")?.value;
    const r = form.querySelector("input[name=r]:checked")?.value;
    const allowed = (f && r) ? RACE_CLASS[f][r] : null;
    form.querySelectorAll("input[name=c]").forEach(i => {
      const ok = !allowed || allowed.includes(i.value);
      i.disabled = !ok;
      i.closest("label").classList.toggle("off", !ok);
      if (!ok && i.checked) i.checked = false;
    });
  };
  form.addEventListener("change", e => { if (e.target.name === "f") fillRaces(e.target.value); if (e.target.name === "f" || e.target.name === "r") syncClasses(); });
  syncClasses();
  form.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(form);
    const f = fd.get("f"), r = fd.get("r"), c = fd.get("c");
    if (!f || !r || !c){ main.querySelector("#err").textContent = "陣營、種族、職業都要選"; return; }
    who = {f, r, c};
    try { localStorage.setItem("dq-who", JSON.stringify(who)); } catch(e) {}
    render();
  });
}

function renderWho(){
  const el = document.getElementById("who");
  document.body.dataset.f = who.f;
  el.innerHTML = `<span class="chip ${who.f === "H" ? "h" : "a"}" style="--cc:${CLASS_COLOR[who.c]}"><span class="f"></span><span class="r"></span><span class="cl"></span></span><button class="btn" type="button" id="chg">更換角色</button>`;
  el.querySelector(".f").textContent = who.f === "H" ? "部落" : "聯盟";
  el.querySelector(".r").textContent = who.r;
  el.querySelector(".cl").textContent = who.c;
  el.querySelector("#chg").addEventListener("click", () => { const keep = who; who = null; renderGate(); who = null; window._prev = keep; prefill(keep); });
}
function prefill(p){
  if (!p) return;
  const form = main.querySelector("#gate");
  form.querySelector(`input[name=f][value=${p.f}]`).click();
  const r = form.querySelector(`input[name=r][value="${p.r}"]`);
  if (r){ r.checked = true; r.dispatchEvent(new Event("change", {bubbles:true})); }
  const c = form.querySelector(`input[name=c][value="${p.c}"]`); if (c && !c.disabled) c.checked = true;
}

function footer(){
  const f = document.createElement("footer");
  f.textContent = "資料來自「任務清單」試算表與 Wowhead（2026/11/18）。物品圖示與說明框由 Wowhead 提供。「Wowhead 玩家提示」整理自 Wowhead 評論區評分最高的留言。標「（暫譯）」的是還沒有官方中文名稱的任務。";
  main.appendChild(f);
}

function whRefresh(){
  try {
    if (window.WH && WH.Tooltips && WH.Tooltips.refreshLinks){ document.body.classList.add("wh-on"); WH.Tooltips.refreshLinks(); }
    else if (window.$WowheadPower && $WowheadPower.refreshLinks){ document.body.classList.add("wh-on"); $WowheadPower.refreshLinks(); }
  } catch(e) {}
}
window.addEventListener("load", () => setTimeout(whRefresh, 300));
function render(){
  setTimeout(whRefresh, 50);
  if (!who){ renderGate(); return; }
  search.disabled = false;
  renderWho();
  renderNav();
  const term = search.value.trim();
  term ? renderSearch(term) : renderDungeon();
}
search.addEventListener("input", render);
function fromHash(){
  const h = location.hash.slice(1);
  current = DUNGEONS.some(d => d.id === h) ? h : DUNGEONS[0].id;
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
